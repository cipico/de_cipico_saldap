services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: civicrm
      MYSQL_USER: civicrm
      MYSQL_PASSWORD: civicrm
    tmpfs:
      - /var/lib/mysql

  civicrm:
    image: michaelmcandrew/civicrm-buildkit:php8.2
    depends_on:
      - mysql
    environment:
      MYSQL_HOST: mysql
    volumes:
      - ..:/ext/de_cipico_saldap
    working_dir: /ext/de_cipico_saldap
    command: >
      bash -c "
        civibuild create ci_test --type standalone
          --version 6.13 --php 8.2 --civi-ver 6.13
          --url http://localhost --db mysql://civicrm:civicrm@mysql/civicrm
        && ln -s /ext/de_cipico_saldap
          /opt/buildkit/build/ci_test/sites/default/ext/de_cipico_saldap
        && cv ext:enable de_cipico_saldap
        && phpunit8 tests/phpunit/Api4/SaldapTest.php
        && civibuild destroy ci_test
      "
